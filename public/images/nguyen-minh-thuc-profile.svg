<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">ẢNH GIỚI THIỆU — CÁ NHÂN</title>
  <desc id="desc">Ảnh giữ chỗ phong cách xanh navy, vàng kim và xanh dương cho website tư vấn tài chính cá nhân.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020817"/><stop offset=".55" stop-color="#071a30"/><stop offset="1" stop-color="#06142a"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1687ff" stop-opacity=".32"/><stop offset="1" stop-color="#020817"/></linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102b4d"/><stop offset="1" stop-color="#020817"/></linearGradient>
    <radialGradient id="skin"><stop stop-color="#a9b6c8" stop-opacity=".35"/><stop offset="1" stop-color="#1687ff" stop-opacity=".08"/></radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#54c4ff" stroke-opacity=".07"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="900" height="1100" fill="url(#bg)"/>
  <rect width="900" height="1100" fill="url(#grid)"/>
  <ellipse cx="522" cy="418" rx="288" ry="308" fill="#1687ff" opacity=".12" filter="url(#glow)"/>
  <path d="M0 748 L126 682 L225 726 L351 550 L477 638 L612 418 L738 484 L900 297" fill="none" stroke="#1687ff" stroke-opacity=".28" stroke-width="3"/>
  <g opacity=".9">
      <circle cx="450" cy="374" r="104" fill="url(#skin)" stroke="#54c4ff" stroke-opacity=".38" stroke-width="3"/>
      <path d="M 225 924 Q 252 583 450 561 Q 648 583 675 924 Z" fill="url(#suit)" stroke="#1687ff" stroke-opacity=".5" stroke-width="3"/>
      <path d="M 396 583 L 450 748 L 504 583" fill="#f4f7fb" opacity=".92"/>
    </g>
  <g transform="translate(72 968)">
    <rect x="0" y="-48" width="54" height="3" fill="#e7b449"/>
    <text fill="#f6d47a" font-family="Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="2">ẢNH GIỚI THIỆU</text>
    <text y="38" fill="#a9b6c8" font-family="Arial, sans-serif" font-size="14" letter-spacing="3">CÁ NHÂN</text>
  </g>
  <rect x="2" y="2" width="896" height="1096" fill="none" stroke="#e7b449" stroke-opacity=".2" stroke-width="4"/>
</svg>